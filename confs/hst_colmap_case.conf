general {
    base_exp_dir = "/content/drive/MyDrive/Tesi/neus/pipeline_test/training/colmap_test/CASE_NAME"
    recording = [
        "./",
        "./models"
    ]
}

dataset {
    data_dir = "/content/drive/MyDrive/Tesi/neus/pipeline_test/data/colmap_subset/neus_set/CASE_NAME"

    # COLMAP/NeuS preprocess output
    render_cameras_name = preprocessed/cameras_sphere.npz
    object_cameras_name = preprocessed/cameras_sphere.npz
}

train {
    learning_rate = 5e-4
    learning_rate_alpha = 0.05

    end_iter = 150000
    batch_size = 256
    warm_up_end = 100
    anneal_end = 0
    use_white_bkgd = False

    save_freq = 25000          
    val_freq = 1000            
    val_mesh_freq = 25000     
    report_freq = 100

    igr_weight = 0.1
    mask_weight = 0.1          
    validate_resolution_level = 4
}

model {
    nerf {
        D = 8,
        d_in = 4,
        d_in_view = 3,
        W = 256,
        multires = 10,
        multires_view = 4,
        output_ch = 4,
        skips=[4],
        use_viewdirs=True
    }

    sdf_network {
        d_out = 257
        d_in = 3
        d_hidden = 256
        n_layers = 8
        skip_in = [4]
        multires = 6
        bias = 0.5
        scale = 1.0
        geometric_init = True
        weight_norm = True
    }

    variance_network {
        init_val = 0.3
    }

    rendering_network {
        d_feature = 256
        mode = idr
        d_in = 9
        d_out = 3
        d_hidden = 256
        n_layers = 4
        weight_norm = True
        multires_view = 4
        squeeze_out = True
    }

    neus_renderer {
        n_samples = 32
        n_importance = 32
        n_outside = 0
        up_sample_steps = 2
        perturb = 1.0
    }
}
